name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run typecheck

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Project (non-custom-domain) GitHub Pages sites are served from
      # /<repo-name>/, so the build needs that path baked into asset URLs.
      - run: npm run build -- --base=/${{ github.event.repository.name }}/
        env:
          # Optional. Set a repository variable/secret with this name to
          # have the group class form record registrations to a Google
          # Sheet — see docs/google-apps-script.gs and README.md. Left
          # unset, the build just omits it and the form behaves as a
          # local-only demo, same as before.
          VITE_GROUP_REGISTRATION_ENDPOINT: ${{ secrets.VITE_GROUP_REGISTRATION_ENDPOINT }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
