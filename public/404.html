<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Ekam Yoga Studio</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages: https://github.com/rafgraph/spa-github-pages
      // GitHub Pages has no server-side rewrites, so a deep link or a page
      // refresh on any route other than "/" hits this 404 page. It encodes
      // the intended path into a query string and redirects to the app's
      // root, where the script in index.html decodes it back before React
      // Router reads the URL.
      //
      // pathSegmentsToKeep = 1 because this is a GitHub Pages *project* site
      // (served under /<repo-name>/), so the first path segment is the repo
      // name and must be preserved, not treated as a route.
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") +
          "/?/" +
          l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
